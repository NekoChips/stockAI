x-stockai-environment: &stockai-environment
  TZ: Asia/Shanghai
  STOCK_AI_MYSQL_HOST: "CHANGE_ME"
  STOCK_AI_MYSQL_PORT: "3306"
  STOCK_AI_MYSQL_DATABASE: "CHANGE_ME"
  STOCK_AI_MYSQL_USERNAME: "CHANGE_ME"
  STOCK_AI_MYSQL_PASSWORD: "CHANGE_ME"
  ALPHAFEED_API_KEY: "CHANGE_ME"

x-stockai-service: &stockai-service
  image: ghcr.io/nekochips/stockai:latest
  pull_policy: always
  environment: *stockai-environment
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  monitor:
    <<: *stockai-service
    command: ["monitor", "--config", "config/release.container.yaml"]

  web:
    <<: *stockai-service
    command: ["web", "--config", "config/release.container.yaml", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
