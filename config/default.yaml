{
  "environment": "development",
  "market": {
    "timezone": "Asia/Shanghai",
    "allowed_exchanges": ["SH", "SZ"],
    "allowed_asset_types": ["stock", "etf"]
  },
  "data": {
    "provider": "alphafeed",
    "market_fallback_providers": ["akshare"],
    "history_provider": "alphafeed",
    "history_fallback_providers": ["akshare", "eastmoney_public"],
    "freshness_seconds": 120,
    "history": {
      "interval": "daily",
      "adjust": "qfq",
      "start": "20240101",
      "end": "20500101",
      "monitor_minimum_bars": 35,
      "monitor_history_limit": 80,
      "retry_attempts": 1,
      "retry_backoff_seconds": 1,
      "fallback_retry_attempts": 2,
      "fallback_retry_backoff_seconds": 15,
      "circuit_breaker_failure_threshold": 1,
      "circuit_breaker_cooldown_seconds": 60
    },
    "providers": {
      "alphafeed": {
        "api_key_env": "ALPHAFEED_API_KEY",
        "min_request_interval_seconds": 7.5,
        "quote_cache_seconds": 3,
        "quote_max_symbols_per_request": 5,
        "quote_max_requests_per_minute": 8,
        "kline_max_symbols_per_request": 1,
        "kline_max_requests_per_minute": 8,
        "history_count": 2000,
        "circuit_breaker_failure_threshold": 1,
        "circuit_breaker_cooldown_seconds": 60
      },
      "akshare": {
        "stock_spot_function": "stock_zh_a_spot_em",
        "fund_spot_function": "fund_etf_spot_em",
        "stock_history_function": "stock_zh_a_hist",
        "stock_history_fallback_functions": ["stock_zh_a_hist_tx"],
        "fund_history_function": "fund_etf_hist_em",
        "fund_history_fallback_functions": ["fund_etf_hist_sina"],
        "index_history_function": "stock_zh_index_daily_tx",
        "index_history_fallback_functions": ["stock_zh_index_daily", "index_zh_a_hist"]
      },
      "biying": {
        "licence_env": "BIYING_API_LICENCE",
        "licence": "",
        "base_url": "https://api.biyingapi.com",
        "stock_realtime_path": "/hsstock/real/time/{code}/{licence}",
        "fund_realtime_path": "/fd/real/time/{code}/{licence}",
        "history_base_url": "https://api.biyingapi.com",
        "history_path_template": "/hsstock/vip/{symbol}/{interval}/{adjust}/{licence}"
      },
      "eastmoney_public": {
        "base_url": "https://push2.eastmoney.com",
        "history_base_url": "https://push2his.eastmoney.com"
      }
    }
  },
  "storage": {
    "driver": "mock",
    "database": "",
    "backup_dir": ""
  },
  "monitor": {
    "poll_seconds": 60,
    "post_close_report_time": "15:05",
    "respect_market_hours": true,
    "settle_on_start": true
  },
  "web": {
    "require_basic_auth": false,
    "username": "",
    "password": "",
    "analysis_start_date": "2026-01-01"
  },
  "paper_account": {
    "initial_cash": "1000000",
    "fee_rate": "0.0003",
    "slippage_rate": "0.0005"
  },
  "universe": [],
  "benchmarks": [
    {"symbol": "000001.SH", "name": "上证指数", "akshare_symbol": "000001"},
    {"symbol": "399001.SZ", "name": "深证成指", "akshare_symbol": "399001"},
    {"symbol": "000300.SH", "name": "沪深300", "akshare_symbol": "000300"},
    {"symbol": "399006.SZ", "name": "创业板指", "akshare_symbol": "399006"},
    {"symbol": "000688.SH", "name": "科创50", "akshare_symbol": "000688"}
  ],
  "risk": {
    "max_symbol_weight": "0.30",
    "max_etf_weight": "0.30",
    "max_stock_weight": "0.30",
    "max_etf_total_weight": "0.50",
    "max_stock_total_weight": "0.40",
    "max_total_exposure": "0.90",
    "min_cash_ratio": "0.10",
    "max_daily_trades": null,
    "max_operations_per_symbol": 10,
    "max_drawdown": "0.10",
    "single_position_loss": "0.08",
    "trailing_drawdown": "0.06",
    "portfolio_daily_loss": "0.03",
    "high_atr_ratio": "0.04"
  },
  "strategy": {
    "target_weight_levels": ["0", "0.20", "0.40", "0.60"],
    "manual_approval_required": true,
    "enabled_by_asset_type": {
      "etf": ["technical_composite", "time_series_momentum"],
      "stock": ["technical_composite", "time_series_momentum"]
    },
    "weights": {
      "technical_composite": "0.30",
      "time_series_momentum": "0.20",
      "mean_reversion": "0.15",
      "relative_strength": "0.20",
      "volatility_target": "0.15",
      "drawdown_control": "0.10",
      "futures_sentiment": "0.15",
      "overseas_sentiment": "0.25",
      "lhb_follow": "0.35",
      "quant_sector_rotation": "0.20"
    },
    "weights_by_asset_type": {
