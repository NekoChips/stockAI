        "technical_composite": "0.40",
        "time_series_momentum": "0.20",
        "futures_sentiment": "0.15",
        "overseas_sentiment": "0.25"
      },
      "stock": {
        "technical_composite": "0.25",
        "time_series_momentum": "0.10",
        "futures_sentiment": "0.10",
        "lhb_follow": "0.35",
        "quant_sector_rotation": "0.20"
      }
    },
    "aggregator": {
      "buy_score_threshold": "0.60",
      "exit_score_threshold": "-0.60",
      "conflict_max_weight": "0.20",
      "confidence_divisor": "1"
    },
    "technical": {
      "bullish_score": "2",
      "bearish_score": "-2",
      "macd_score": "1.5",
      "rsi_overbought": "75",
      "rsi_healthy_low": "45",
      "rsi_healthy_high": "70",
      "rsi_oversold": "35",
      "bollinger_high": "2",
      "bollinger_low": "-1.2",
      "atr_high": "0.04",
      "volume_confirm": "1"
    },
    "quant": {
      "lookback_days": 20,
      "holding_days": 5,
      "mean_reversion_z": "-1.2",
      "drawdown_stop": "0.08",
      "cooldown_days": 3
    }
  }
