[project]
name = "stock-ai-agent"
version = "0.1.1"
description = "A-share and ETF paper-trading AI agent for Shanghai/Shenzhen markets."
requires-python = ">=3.9"
dependencies = [
  "akshare>=1.15",
  "PyMySQL>=1.1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
