[project]
name = "stock-ai-agent"
version = "0.1.1"
description = "A-share and ETF paper-trading AI agent for Shanghai/Shenzhen markets."
requires-python = ">=3.9"
dependencies = [
  "alphafeed==0.1.4",
  "akshare==1.18.94",
  "exchange-calendars>=4.5,<5",
  "PyMySQL==1.1.1"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_ai_agent = ["spa/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
