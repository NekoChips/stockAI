<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockAI 数据中心 Prototype</title>
  <style>
    /* Three variants of the data center page, switchable with ?variant=A|B|C. */
    :root {
      --bg: #07111f;
      --surface: #0d1b2d;
      --surface-2: #11243a;
      --line: #243b55;
      --line-soft: rgba(148, 163, 184, .16);
      --text: #edf5ff;
      --muted: #8ea4bb;
      --blue: #3b82f6;
      --blue-soft: #163c70;
      --cyan: #38bdf8;
      --green: #21c58b;
      --green-soft: rgba(33, 197, 139, .13);
      --red: #f06b72;
      --red-soft: rgba(240, 107, 114, .13);
      --amber: #f2b84b;
      --amber-soft: rgba(242, 184, 75, .13);
      --shadow: 0 18px 50px rgba(0, 0, 0, .22);
      --radius: 12px;
      --mono: "Fira Code", "SFMono-Regular", Consolas, monospace;
      --sans: "Fira Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(56, 189, 248, .5); outline-offset: 2px; }
    .prototype-ribbon { position: fixed; z-index: 50; top: 14px; right: 14px; padding: 5px 9px; border: 1px solid #3970b4; border-radius: 999px; color: #b9d7ff; background: #0d2a4d; font-size: 11px; letter-spacing: .06em; }
    .app { min-height: 100vh; }
    .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { padding: 28px 16px; border-right: 1px solid var(--line-soft); background: #091827; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 10px 38px; font-weight: 700; letter-spacing: .02em; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: white; background: linear-gradient(145deg, #2563eb, #38bdf8); box-shadow: 0 8px 24px rgba(37, 99, 235, .32); }
    .brand-mark svg { width: 18px; height: 18px; }
    .nav { display: grid; gap: 5px; }
    .nav button { display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; text-align: left; }
    .nav button.active, .nav button:hover { color: var(--text); background: #12335b; }
    .nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .sidebar-foot { margin: 80px 10px 0; padding-top: 16px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; }
    .sidebar-foot strong { display: block; margin-top: 4px; color: var(--text); font: 12px var(--mono); }
    .main { min-width: 0; padding: 30px clamp(18px, 3vw, 44px) 110px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 5px; color: var(--cyan); font: 11px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: clamp(24px, 3vw, 34px); line-height: 1.15; letter-spacing: -.02em; }
    h2 { margin-bottom: 3px; font-size: 18px; }
    h3 { margin-bottom: 0; font-size: 14px; }
    .subtitle { margin: 0; color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #10243b; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .button:hover { border-color: #4f86c5; background: #153253; transform: translateY(-1px); }
    .button.primary { border-color: #2f78e5; background: var(--blue); }
    .button.primary:hover { background: #5598ff; }
    .button.danger { color: #ffb8bc; border-color: rgba(240, 107, 114, .45); background: var(--red-soft); }
    .button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; font-size: 12px; }
    .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px currentColor; opacity: .22; }
    .status-pill.ok { color: var(--green); background: var(--green-soft); }
    .status-pill.warn { color: var(--amber); background: var(--amber-soft); }
    .status-pill.bad { color: var(--red); background: var(--red-soft); }
    .grid { display: grid; gap: 14px; }
    .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
    .metric, .panel, .dataset, .task, .quality-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .metric { padding: 17px 18px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 7px; font: 700 25px/1 var(--mono); letter-spacing: -.06em; }
    .metric-meta { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .metric-meta.good { color: var(--green); }
    .metric-meta.warn { color: var(--amber); }
    .metric-meta.bad { color: var(--red); }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .section-head p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .panel { padding: 20px; }
    .two-col { grid-template-columns: minmax(0, 1.55fr) minmax(290px, .85fr); align-items: start; }
    .dataset-list { display: grid; gap: 9px; }
    .dataset { display: grid; grid-template-columns: minmax(170px, 1.2fr) repeat(4, minmax(80px, .65fr)) auto; gap: 14px; align-items: center; padding: 14px 15px; box-shadow: none; transition: border-color .18s ease, background .18s ease; }
    .dataset:hover { border-color: #3d6fa7; background: #10243a; }
    .dataset-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .dataset-icon { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; color: #9bc9ff; background: var(--blue-soft); }
    .dataset-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .dataset-name strong, .dataset-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dataset-name span { color: var(--muted); font: 11px var(--mono); }
    .data-stat label { display: block; color: var(--muted); font-size: 11px; }
    .data-stat strong { display: block; margin-top: 2px; font: 13px var(--mono); }
    .dataset .button { min-height: 32px; padding: 0 10px; font-size: 12px; }
    .issue-list { display: grid; gap: 10px; }
    .issue { padding: 13px; border: 1px solid var(--line-soft); border-left: 3px solid var(--amber); border-radius: 8px; background: #0d1b2d; }
    .issue.bad { border-left-color: var(--red); }
    .issue-top { display: flex; justify-content: space-between; gap: 10px; }
    .issue small { color: var(--muted); }
    .issue p { margin: 7px 0 0; color: #c3d2e3; font-size: 12px; }
    .issue-action { display: inline-block; margin-top: 8px; padding: 0; border: 0; color: #84bdff; background: transparent; font-size: 12px; }
    .progress { height: 6px; overflow: hidden; border-radius: 99px; background: #1a3049; }
    .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
    .coverage-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-top: 12px; }
    .coverage-row small { color: var(--muted); }
    .task-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .task { padding: 14px; box-shadow: none; }
    .task-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .task p { margin: 8px 0 12px; color: var(--muted); font-size: 12px; }
    .task-foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font: 11px var(--mono); }
    .task-foot button { padding: 0; border: 0; color: #8bc2ff; background: transparent; }
    .table-wrap { overflow: auto; }
    table { width: 100%; min-width: 680px; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-size: 11px; font-weight: 500; }
    td { color: #dbe9f8; font-size: 12px; }
    td.mono, th.mono { font-family: var(--mono); }
    .source { color: var(--cyan); }
    .quality-good { color: var(--green); }
    .quality-warn { color: var(--amber); }
    .quality-bad { color: var(--red); }
    .select, .search { min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: #0b1a2c; }
    .search { width: min(250px, 100%); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .chart { position: relative; min-height: 190px; padding: 13px 0 0; }
    .chart svg { width: 100%; height: 178px; overflow: visible; }
    .chart-grid { stroke: #21405d; stroke-width: 1; stroke-dasharray: 3 5; }
    .chart-line { fill: none; stroke: var(--cyan); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: url(#area); }
    .chart-label { fill: #7f96ae; font-size: 10px; }
    .timeline { display: grid; gap: 0; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 85px 16px 1fr; gap: 12px; min-height: 72px; }
    .timeline-item::before { content: ""; position: absolute; top: 16px; bottom: -3px; left: 92px; width: 1px; background: var(--line); }
    .timeline-item:last-child::before { display: none; }
    .timeline-time { color: var(--muted); font: 11px var(--mono); }
    .timeline-dot { position: relative; z-index: 1; width: 10px; height: 10px; margin-top: 4px; border: 2px solid var(--cyan); border-radius: 50%; background: var(--bg); }
    .timeline-dot.bad { border-color: var(--red); }
    .timeline-dot.warn { border-color: var(--amber); }
    .timeline-body strong { display: block; }
    .timeline-body p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .drawer-backdrop, .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(2, 6, 23, .72); }
    .drawer { position: absolute; top: 0; right: 0; width: min(720px, 100%); height: 100%; overflow: auto; padding: 24px; border-left: 1px solid var(--line); background: #0b192a; box-shadow: -20px 0 60px rgba(0,0,0,.3); }
    .drawer-head, .modal-head { display: flex; justify-content: space-between; gap: 14px; align-items: start; }
    .close { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: transparent; }
    .close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .detail-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line-soft); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .detail-cell { padding: 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); }
    .detail-cell small { color: var(--muted); }
    .detail-cell strong { display: block; margin-top: 4px; font: 12px var(--mono); }
    .drawer-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin-top: 20px; border: 1px solid var(--line); border-radius: 9px; background: #091727; }
    .tab-button { flex: 0 0 auto; min-height: 32px; padding: 0 11px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 12px; }
    .tab-button.active, .tab-button:hover { color: var(--text); background: var(--blue-soft); }
    .scope-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 11px 12px; border: 1px solid #31567e; border-radius: 9px; background: #0e2844; }
    .scope-bar strong { color: #d9ebff; }
    .symbol-table { display: grid; gap: 7px; margin-top: 10px; }
    .symbol-row { display: grid; grid-template-columns: minmax(130px, 1.2fr) repeat(3, minmax(62px, .65fr)) auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); }
    .symbol-row.selected { border-color: #3f82d2; background: #102b48; }
    .symbol-row strong, .symbol-row span { display: block; }
    .symbol-row small { display: block; color: var(--muted); font-size: 10px; }
    .symbol-row .button { min-height: 29px; padding: 0 8px; font-size: 11px; }
    .source-stack { display: grid; gap: 8px; margin-top: 10px; }
    .source-line { display: grid; grid-template-columns: 86px 1fr 48px; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; }
    .source-line strong { color: var(--text); text-align: right; font: 11px var(--mono); }
    .source-bar { height: 7px; overflow: hidden; border-radius: 99px; background: #1a3049; }
    .source-bar span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .gap-list { display: grid; gap: 7px; margin-top: 10px; }
    .gap-item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px; border: 1px solid rgba(242, 184, 75, .22); border-radius: 8px; color: #e9d3a1; background: var(--amber-soft); font-size: 12px; }
    .sample-table { margin-top: 10px; border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; }
    .sample-table table { min-width: 560px; }
    .action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
    .action-card { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #10243b; text-align: left; }
    .action-card strong { display: block; }
    .action-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .task-backdrop { position: fixed; inset: 0; z-index: 25; display: none; place-items: center; padding: 20px; background: rgba(2, 6, 23, .72); }
    .task-modal { width: min(520px, 100%); padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: #0d1b2d; box-shadow: var(--shadow); }
    .task-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
    .task-summary div { padding: 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface); }
    .task-summary small { display: block; color: var(--muted); }
    .task-summary strong { display: block; margin-top: 4px; font: 12px var(--mono); }
    .task-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 14px; }
    .task-field { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
    .task-field input, .task-field select { width: 100%; min-height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: #0b1a2c; font: 12px var(--mono); }
    .task-field:last-child { grid-column: 1 / -1; }
    .task-risk { margin-top: 12px; padding: 10px 11px; border-left: 3px solid var(--amber); color: #e7cc95; background: var(--amber-soft); font-size: 12px; }
    .modal-backdrop { display: none; place-items: center; padding: 20px; }
    .modal { width: min(440px, 100%); padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: #0d1b2d; box-shadow: var(--shadow); }
    .modal p { color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .toast { position: fixed; z-index: 40; right: 20px; bottom: 84px; display: none; max-width: min(380px, calc(100vw - 40px)); padding: 12px 15px; border: 1px solid #2d659f; border-radius: 8px; color: #d7ebff; background: #0f2f53; box-shadow: var(--shadow); }
    .prototype-switcher { position: fixed; z-index: 30; left: 50%; bottom: 18px; display: flex; align-items: center; gap: 8px; transform: translateX(-50%); padding: 6px 8px; border: 1px solid #4d76a2; border-radius: 999px; background: rgba(7, 17, 31, .95); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    .prototype-switcher button { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; color: #d5e8ff; background: transparent; }
    .prototype-switcher button:hover { background: #173963; }
    .prototype-switcher svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .variant-label { min-width: 146px; color: #c4ddf7; text-align: center; font-size: 12px; }

    /* Variant B: quality-first light workspace. */
    body.variant-b { --bg: #eef4fa; --surface: #fff; --surface-2: #f4f8fc; --line: #cbdced; --line-soft: #e3ebf3; --text: #14243b; --muted: #687d95; --blue-soft: #e7f1ff; --shadow: 0 10px 26px rgba(49, 88, 125, .08); }
    .variant-b .sidebar { background: #f7fbff; }
    .variant-b .nav button.active, .variant-b .nav button:hover { color: #1457a6; background: #e6f0fc; }
    .variant-b .metric, .variant-b .panel, .variant-b .dataset, .variant-b .task, .variant-b .quality-card { box-shadow: none; }
    .variant-b .issue, .variant-b .task { background: #f9fcff; }
    .variant-b .button, .variant-b .select, .variant-b .search { color: var(--text); background: #fff; }
    .variant-b .button.primary { color: white; background: #1d6fe8; }
    .variant-b .chart-grid { stroke: #d6e3ef; }
    .variant-b .chart-label { fill: #7b91a8; }
    .variant-b .timeline-dot { background: white; }
    .variant-b .prototype-ribbon { color: #175796; background: #dcecff; border-color: #8db9ed; }
    .variant-b .drawer, .variant-b .task-modal { background: #fff; }
    .variant-b .drawer-tabs { background: #f4f8fc; }
    .variant-b .tab-button.active, .variant-b .tab-button:hover { color: #1457a6; background: #e6f0fc; }
    .variant-b .scope-bar { color: #1457a6; background: #edf6ff; border-color: #b9d5f2; }
    .variant-b .scope-bar strong { color: #174d86; }
    .variant-b .symbol-row.selected { background: #eef6ff; border-color: #7db2e8; }
    .variant-b .action-card { background: #f4f8fc; }
    .variant-b .source-bar { background: #dbe8f3; }
    .variant-b .task-field input, .variant-b .task-field select { color: var(--text); background: #fff; }

    /* Variant C: task-first workbench removes the sidebar and emphasizes queue flow. */
    body.variant-c { --bg: #10131a; --surface: #171d28; --surface-2: #1b2532; --line: #344254; --line-soft: rgba(164, 182, 204, .16); --text: #f1f5fb; --muted: #9baabe; --blue: #4f8df7; --cyan: #5ed4ff; --shadow: 0 16px 35px rgba(0,0,0,.18); }
    .variant-c .shell { display: block; }
    .variant-c .sidebar { display: none; }
    .variant-c .main { max-width: 1320px; margin: 0 auto; }
    .variant-c .topbar { align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--line-soft); }
    .variant-c .metrics { grid-template-columns: repeat(3, 1fr); }
    .variant-c .metrics .metric:last-child { display: none; }
    .variant-c .two-col { grid-template-columns: minmax(0, 1fr) minmax(290px, .6fr); }
    .variant-c .panel.queue { border-top: 3px solid var(--blue); }
    .variant-c .dataset-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .variant-c .dataset { grid-template-columns: minmax(145px, 1fr) auto; }
    .variant-c .dataset .data-stat { display: none; }
    .variant-c .task-list { grid-template-columns: 1fr; }
    .variant-c .task { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; }
    .variant-c .task p { margin-bottom: 0; }
    .variant-c .task-foot { grid-column: 1 / -1; }
    .variant-c .chart-panel { display: none; }

    @media (max-width: 1000px) {
      .shell { grid-template-columns: 72px minmax(0, 1fr); }
      .sidebar { padding-inline: 10px; }
      .brand { justify-content: center; margin-inline: 0; }
      .brand span, .nav button span, .sidebar-foot { display: none; }
      .nav button { justify-content: center; padding: 0; }
      .two-col { grid-template-columns: 1fr; }
      .task-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .shell { display: block; }
      .sidebar { display: none; }
      .main { padding: 22px 14px 105px; }
      .topbar { display: block; }
      .top-actions { justify-content: flex-start; margin-top: 16px; }
      .metrics, .variant-c .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { padding: 14px; }
      .metric-value { font-size: 21px; }
      .dataset-list, .variant-c .dataset-list { grid-template-columns: 1fr; }
      .dataset { grid-template-columns: minmax(145px, 1fr) auto; }
      .dataset .data-stat { display: none; }
      .panel { padding: 16px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .variant-label { min-width: 120px; }
      .drawer { padding: 18px; }
      .symbol-row { grid-template-columns: minmax(130px, 1fr) repeat(2, minmax(60px, .7fr)) auto; }
      .symbol-row .data-stat:nth-child(4) { display: none; }
      .action-grid { grid-template-columns: 1fr; }
      .task-fields { grid-template-columns: 1fr; }
      .task-field:last-child { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="prototype-ribbon">PROTOTYPE · 内存假数据</div>
  <div id="app" class="app"></div>
  <div id="drawer-backdrop" class="drawer-backdrop" role="presentation"></div>

    let current = (params.get('variant') || 'A').toUpperCase();
    if (!variants[current]) current = 'A';
    const app = document.getElementById('app');
    function render() {
      document.body.classList.remove('variant-b', 'variant-c');
      if (current === 'B') document.body.classList.add('variant-b');
      if (current === 'C') document.body.classList.add('variant-c');
      app.innerHTML = variants[current][1]();
      app.insertAdjacentHTML('beforeend', `<div class="prototype-switcher" aria-label="原型方案切换"><button data-prev aria-label="上一个方案">${icon('arrow').replace('<path', '<path transform="rotate(180 12 12)"')}</button><span class="variant-label">${current} · ${variants[current][0]}</span><button data-next aria-label="下一个方案">${icon('arrow')}</button></div>`);
      wire();
    }
    function setVariant(next) {
      current = next;
      const nextParams = new URLSearchParams(location.search);
      nextParams.set('variant', current);
      history.replaceState({}, '', `${location.pathname}?${nextParams}`);
      render();
    }
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.style.display = 'block';
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.style.display = 'none'; }, 2600);
    }
    let activeDataset = null;
    let activeSymbol = null;

    function symbolDetail(item, row) {
      const sources = row.source.length ? row.source.map(([name, percent]) => `<div class="source-line"><span>${name}</span><div class="source-bar"><span style="width:${percent}%"></span></div><strong>${percent}%</strong></div>`).join('') : '<span style="color:var(--red);font-size:12px">暂无成功来源</span>';
      const gaps = row.gaps.map(gap => `<div class="gap-item"><span>${gap}</span><strong>${row.missing === '0' ? '正常' : '待处理'}</strong></div>`).join('');
      const latest = row.latest === '--' ? '--' : `${row.latest}`;
      return `<section class="detail-block"><div class="section-head"><div><h3>${row.name} <span class="mono" style="color:var(--muted);font-weight:400">${row.symbol}</span></h3><p>当前标的诊断 · ${row.impact}</p></div>${status(row.state, row.tone)}</div><div class="detail-grid"><div class="detail-cell"><small>预期记录</small><strong>${row.expected}</strong></div><div class="detail-cell"><small>实际记录</small><strong>${row.actual}</strong></div><div class="detail-cell"><small>缺失数量</small><strong class="${row.missing !== '0' && row.missing !== '—' ? 'quality-warn' : ''}">${row.missing}</strong></div><div class="detail-cell"><small>最新数据</small><strong>${latest}</strong></div></div><div class="detail-subsection"><h3>缺口诊断</h3><div class="gap-list">${gaps}</div></div><div class="detail-subsection"><h3>来源占比</h3><div class="source-stack">${sources}</div></div><div class="detail-subsection"><h3>最近样本 <span style="color:var(--muted);font-weight:400">只读 · 3 条</span></h3><div class="sample-table"><table><thead><tr><th>时间</th><th>开盘</th><th>最高</th><th>最低</th><th>收盘</th><th>来源</th></tr></thead><tbody><tr><td class="mono">${latest}</td><td>1,024.12</td><td>1,031.88</td><td>1,018.26</td><td>1,029.40</td><td class="source">${row.source[0]?.[0] || '—'}</td></tr><tr><td class="mono">前一条</td><td>1,016.40</td><td>1,025.80</td><td>1,012.10</td><td>1,022.60</td><td class="source">${row.source[0]?.[0] || '—'}</td></tr><tr><td class="mono">更早一条</td><td>1,011.20</td><td>1,018.40</td><td>1,006.50</td><td>1,015.90</td><td class="source">${row.source[0]?.[0] || '—'}</td></tr></tbody></table></div></div></section>`;
    }

    function renderDrawer(item, symbol) {
      const rows = item.symbolRows || [];
      const selected = rows.find(row => row.symbol === symbol) || rows[0];
      const backdrop = document.getElementById('drawer-backdrop');
      backdrop.innerHTML = `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><div><p class="eyebrow">数据域详情 · ${item.table}</p><h2 id="drawer-title">${item.name}</h2><p class="subtitle">${item.affected}</p></div><button class="close" data-close-drawer aria-label="关闭">${icon('close')}</button></div><div class="drawer-tabs"><button class="tab-button active">概览</button><button class="tab-button">标的覆盖</button><button class="tab-button">缺口诊断</button><button class="tab-button">来源与失败</button><button class="tab-button">样本预览</button></div><div class="detail-block" style="margin-top:16px;padding-top:0;border-top:0"><div class="scope-bar"><div><small style="display:block;color:var(--muted)">当前诊断范围</small><strong>${selected ? `${selected.name} · ${selected.symbol}` : '暂无可诊断标的'}</strong></div><select class="select" data-symbol-select aria-label="选择诊断标的">${rows.map(row => `<option value="${row.symbol}" ${selected && row.symbol === selected.symbol ? 'selected' : ''}>${row.symbol} · ${row.name}</option>`).join('')}</select></div></div><section class="detail-block"><div class="section-head"><div><h3>数据域摘要</h3><p>统一口径 · 只读聚合</p></div>${status(item.state, item.tone)}</div><div class="detail-grid"><div class="detail-cell"><small>有效记录</small><strong>${item.count}</strong></div><div class="detail-cell"><small>覆盖标的</small><strong>${item.symbols}</strong></div><div class="detail-cell"><small>覆盖率</small><strong>${item.coverage}%</strong></div><div class="detail-cell"><small>数据延迟</small><strong>${item.latency}</strong></div><div class="detail-cell"><small>最近来源</small><strong>${item.source}</strong></div><div class="detail-cell"><small>最新数据</small><strong>${item.latest}</strong></div></div><div style="margin-top:12px"><div class="progress"><span style="width:${item.coverage}%;${item.tone === 'bad' ? 'background:var(--red)' : ''}"></span></div><small style="display:block;margin-top:7px;color:var(--muted)">影响模块：${item.affected}</small></div></section><section class="detail-block"><div class="section-head"><div><h3>标的覆盖</h3><p>点击“查看”切换下方单标的诊断</p></div><span style="color:var(--muted);font-size:12px">${rows.length} 个标的</span></div><div class="symbol-table">${rows.map(row => `<div class="symbol-row ${selected && row.symbol === selected.symbol ? 'selected' : ''}"><div><strong>${row.name}</strong><small>${row.symbol}</small></div><div class="data-stat"><small>预期 / 实际</small><span class="mono">${row.expected} / ${row.actual}</span></div><div class="data-stat"><small>缺失</small><span class="mono ${row.missing !== '0' && row.missing !== '—' ? 'quality-warn' : ''}">${row.missing}</span></div><div class="data-stat"><small>最新</small><span class="mono">${row.latest}</span></div><div>${status(row.state, row.tone)}<button class="button" data-select-symbol="${row.symbol}" style="margin-left:6px">查看</button></div></div>`).join('')}</div></section>${selected ? symbolDetail(item, selected) : '<section class="detail-block"><p style="color:var(--muted)">当前数据域暂无可诊断的标的。</p></section>'}<section class="detail-block"><div class="section-head"><div><h3>受控操作</h3><p>先选定范围，再提交任务；不会直接修改行情事实。</p></div></div><div class="action-grid"><button class="action-card" data-drawer-action="quality">${icon('pulse')}<strong>质量检查</strong><span>只读数据库，不请求 AlphaFeed 或 AKShare</span></button><button class="action-card" data-drawer-action="backfill">${icon('refresh')}<strong>补数任务</strong><span>当前标的 · 需选择日期并预览请求量</span></button></div></section></aside>`;
      backdrop.style.display = 'block';
      backdrop.querySelector('[data-close-drawer]').focus();
    }

    function openDrawer(table) {
      activeDataset = datasets.find(row => row.table === table) || datasets[0];
      activeSymbol = activeDataset.symbolRows?.[0]?.symbol || null;
      renderDrawer(activeDataset, activeSymbol);
    }

    function openTaskDialog(action, item, symbol) {
      const taskBackdrop = document.getElementById('task-backdrop');
      const row = item?.symbolRows?.find(candidate => candidate.symbol === symbol) || item?.symbolRows?.[0];
      const isQuality = action === 'quality';
      const kind = isQuality ? '质量检查' : '补数任务';
      const scope = item ? `${item.name}${row ? ` · ${row.name} ${row.symbol}` : ' · 全部标的'}` : '未选择数据域';
      const targetCount = row ? 1 : item ? item.symbolRows.length : 0;
      const requestCount = isQuality ? '0（仅读库）' : targetCount ? `${targetCount * 2} 次预估` : '待选择范围';
      taskBackdrop.innerHTML = `<section class="task-modal" role="dialog" aria-modal="true" aria-labelledby="task-title"><div class="drawer-head"><div><p class="eyebrow">创建维护任务</p><h2 id="task-title">${kind}</h2></div><button class="close" data-close-task aria-label="关闭">${icon('close')}</button></div><p style="color:var(--muted)">${isQuality ? '检查当前数据库中的覆盖、缺口、字段和来源状态，不会触发外部行情请求。' : '创建异步补数任务，默认主源优先、备用源兜底。提交前确认范围与请求风险。'}</p><div class="scope-bar"><div><small style="display:block;color:var(--muted)">作用范围</small><strong>${scope}</strong></div>${item ? `<span class="status-pill ${item.tone}">${item.table}</span>` : '<span class="status-pill warn">需要选择</span>'}</div><div class="task-fields"><label class="task-field">开始日期<input type="date" value="2024-01-01" aria-label="开始日期" /></label><label class="task-field">结束日期<input type="date" value="2026-08-27" aria-label="结束日期" /></label><label class="task-field">来源策略<select aria-label="来源策略"><option>${isQuality ? '只读数据库' : 'AlphaFeed 主源优先 · AKShare 备用'}</option></select></label></div><div class="task-summary"><div><small>标的数量</small><strong>${targetCount || '—'}</strong></div><div><small>日期范围</small><strong>2024-01-01 至 2026-08-27</strong></div><div><small>预计请求量</small><strong>${requestCount}</strong></div><div><small>提交方式</small><strong>异步队列</strong></div></div><div class="task-risk">${isQuality ? '本操作只读数据库和交易日历，预计外部接口调用为 0。' : '补数会调用 AlphaFeed；当前只是原型预览，正式实现时需在提交前显示限流窗口和已有任务。'}</div><div class="modal-actions"><button class="button" data-close-task>取消</button><button class="button primary" data-confirm-task ${item ? '' : 'disabled'}>加入任务队列</button></div></section>`;
      taskBackdrop.style.display = 'grid';
      taskBackdrop.querySelector('[data-close-task]').focus();
    }
    function closeDrawer() { document.getElementById('drawer-backdrop').style.display = 'none'; }
    function closeTaskDialog() { document.getElementById('task-backdrop').style.display = 'none'; }
    function openCleanup() { document.getElementById('modal-backdrop').style.display = 'grid'; document.querySelector('[data-close-modal]').focus(); }
    function closeModal() { document.getElementById('modal-backdrop').style.display = 'none'; }
    function wire() {
      document.querySelector('[data-prev]')?.addEventListener('click', () => setVariant(current === 'A' ? 'C' : String.fromCharCode(current.charCodeAt(0) - 1)));
      document.querySelector('[data-next]')?.addEventListener('click', () => setVariant(current === 'C' ? 'A' : String.fromCharCode(current.charCodeAt(0) + 1)));
      document.querySelectorAll('[data-open-dataset]').forEach(button => button.addEventListener('click', () => openDrawer(button.dataset.openDataset)));
      document.querySelectorAll('[data-toast]').forEach(button => button.addEventListener('click', () => showToast(button.dataset.toast)));
      document.querySelectorAll('[data-run-quality]').forEach(button => button.addEventListener('click', () => showToast('请先从数据域详情中选择检查范围。')));
      document.querySelectorAll('[data-backfill]').forEach(button => button.addEventListener('click', () => showToast('请先从数据域详情中选择补数范围。')));
      document.querySelectorAll('[data-cleanup]').forEach(button => button.addEventListener('click', openCleanup));
      document.querySelectorAll('[data-filter]').forEach(input => input.addEventListener('input', () => { const query = input.value.toLowerCase(); document.querySelectorAll('.dataset').forEach(row => { row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none'; }); }));
    }
    document.getElementById('drawer-backdrop').addEventListener('click', event => {
      if (event.target.id === 'drawer-backdrop' || event.target.closest('[data-close-drawer]')) { closeDrawer(); return; }
      const symbolButton = event.target.closest('[data-select-symbol]');
      if (symbolButton && activeDataset) { activeSymbol = symbolButton.dataset.selectSymbol; renderDrawer(activeDataset, activeSymbol); return; }
      const actionButton = event.target.closest('[data-drawer-action]');
      if (actionButton && activeDataset) openTaskDialog(actionButton.dataset.drawerAction, activeDataset, activeSymbol);
    });
    document.getElementById('drawer-backdrop').addEventListener('change', event => {
      if (event.target.matches('[data-symbol-select]') && activeDataset) { activeSymbol = event.target.value; renderDrawer(activeDataset, activeSymbol); }
    });
    document.getElementById('modal-backdrop').addEventListener('click', event => { if (event.target.id === 'modal-backdrop' || event.target.closest('[data-close-modal]')) closeModal(); if (event.target.closest('[data-confirm-cleanup]')) { closeModal(); showToast('已按保留策略提交清理任务。'); } });
    document.getElementById('task-backdrop').addEventListener('click', event => { if (event.target.id === 'task-backdrop' || event.target.closest('[data-close-task]')) closeTaskDialog(); if (event.target.closest('[data-confirm-task]')) { closeTaskDialog(); showToast('任务已加入维护队列，正式版将返回 task_id 并持续更新进度。'); } });
    document.addEventListener('keydown', event => { const tag = event.target.tagName.toLowerCase(); if (['input', 'textarea', 'select'].includes(tag) || event.target.isContentEditable) return; if (event.key === 'ArrowLeft') setVariant(current === 'A' ? 'C' : String.fromCharCode(current.charCodeAt(0) - 1)); if (event.key === 'ArrowRight') setVariant(current === 'C' ? 'A' : String.fromCharCode(current.charCodeAt(0) + 1)); if (event.key === 'Escape') { closeDrawer(); closeModal(); closeTaskDialog(); } });
    render();
  </script>
</body>
</html>
