services:
  monitor:
    build:
      context: .
    image: stockai:release
    env_file:
      - docker/.env.release
    command: ["monitor", "--config", "config/release.container.yaml"]
    restart: unless-stopped
    volumes:
      - ./runtime/reports:/app/reports

  web:
    build:
      context: .
    image: stockai:release
    env_file:
      - docker/.env.release
    command: ["web", "--config", "config/release.container.yaml", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    ports:
      - "${STOCK_AI_WEB_PORT:-8765}:8765"
    volumes:
      - ./runtime/reports:/app/reports
