services:
  monitor:
    build:
      context: .
    image: ghcr.io/nekochips/stockai:latest
    env_file:
      - docker/.env.release
    command: ["monitor", "--config", "config/release.container.yaml"]
    restart: unless-stopped

  web:
    build:
      context: .
    image: ghcr.io/nekochips/stockai:latest
    env_file:
      - docker/.env.release
    command: ["web", "--config", "config/release.container.yaml", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    ports:
      - "${STOCK_AI_WEB_PORT:-8765}:8765"
